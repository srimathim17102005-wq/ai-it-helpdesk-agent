openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: helpdesk
    description: IT helpdesk operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /helpdesk/dashboard:
    get:
      operationId: getHelpdeskDashboard
      tags: [helpdesk]
      summary: Get helpdesk dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpdeskDashboard"
  /helpdesk/tickets:
    get:
      operationId: listTickets
      tags: [helpdesk]
      summary: List helpdesk tickets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: priority
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [helpdesk]
      summary: Create a helpdesk ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /helpdesk/tickets/{id}:
    get:
      operationId: getTicket
      tags: [helpdesk]
      summary: Get a helpdesk ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Ticket not found
    patch:
      operationId: updateTicket
      tags: [helpdesk]
      summary: Update a helpdesk ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Ticket not found
  /helpdesk/activity:
    get:
      operationId: listHelpdeskActivity
      tags: [helpdesk]
      summary: List recent helpdesk activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /helpdesk/diagnose:
    post:
      operationId: diagnoseIssue
      tags: [helpdesk]
      summary: Diagnose an IT issue and suggest next steps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisInput"
      responses:
        "200":
          description: AI troubleshooting response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnosis"
components:
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Ticket:
      type: object
      required: [id, title, description, category, priority, status, requester, assignee, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string }
        status: { type: string }
        requester: { type: string }
        assignee: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    TicketInput:
      type: object
      required: [title, description, category, priority, requester]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category: { type: string }
        priority: { type: string }
        requester: { type: string }
        assignee: { type: ["string", "null"] }
    TicketUpdate:
      type: object
      properties:
        status: { type: string }
        priority: { type: string }
        assignee: { type: ["string", "null"] }
    Activity:
      type: object
      required: [id, type, message, actor, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        message: { type: string }
        actor: { type: string }
        createdAt: { type: string }
        ticketId: { type: ["integer", "null"] }
    HelpdeskDashboard:
      type: object
      required: [openTickets, urgentTickets, resolvedToday, avgResponseMinutes, categoryBreakdown]
      properties:
        openTickets: { type: integer }
        urgentTickets: { type: integer }
        resolvedToday: { type: integer }
        avgResponseMinutes: { type: integer }
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string }
        count: { type: integer }
    DiagnosisInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        category: { type: ["string", "null"] }
    Diagnosis:
      type: object
      required: [summary, steps, confidence, suggestedPriority, suggestedCategory, needsEscalation]
      properties:
        summary: { type: string }
        steps:
          type: array
          items: { type: string }
        confidence: { type: integer }
        suggestedPriority: { type: string }
        suggestedCategory: { type: string }
        needsEscalation: { type: boolean }

